name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # The runners have Docker: missing PostgreSQL is a failure here, not a skip.
      LINQTOREST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore LinqToRest.slnx

      - name: Build (warnings are errors)
        run: dotnet build LinqToRest.slnx -c Release --no-restore

      - name: Format
        run: dotnet format LinqToRest.slnx --verify-no-changes --no-restore

      - name: Inspections
        run: |
          dotnet jb inspectcode LinqToRest.slnx --no-build --properties:Configuration=Release \
            --format=Sarif --output=artifacts/inspect.sarif
          count=$(jq '[.runs[].results[]] | length' artifacts/inspect.sarif)
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[] | "\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.ruleId) \(.message.text)"' artifacts/inspect.sarif
            echo "::error::$count ReSharper inspection finding(s)"
            exit 1
          fi

      - name: Vulnerable packages
        run: |
          dotnet list LinqToRest.slnx package --vulnerable --include-transitive | tee artifacts/vulnerable.txt
          if grep -q "has the following vulnerable packages" artifacts/vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi

      - name: Test (SQLite and PostgreSQL)
        run: dotnet test --solution LinqToRest.slnx -c Release --no-build

      # The tests check the golden models and the client tests' context; these clients are generated from them too.
      - name: Generated C# clients are current
        run: |
          generate() { dotnet run -c Release --no-build --project src/LinqToRest.CodeGen -- cs "$@" --check; }
          generate --model tests/LinqToRest.Server.IntegrationTests/Shop/model.json --namespace LinqToRest.EndToEnd.Tests --context ShopClient --out tests/LinqToRest.EndToEnd.Tests/ShopClient.generated.cs
          generate --model tests/golden/model.json --namespace LinqToRest.Benchmarks.Client --context BenchmarkShop --out benchmarks/LinqToRest.Benchmarks/Client/BenchmarkShop.generated.cs

      # Trimmed like a real deployment, so trimming problems show up here rather than in users' apps.
      - name: Publish the Blazor catalog sample (Release, trimmed)
        run: dotnet publish samples/Catalog/Catalog.Blazor -c Release --no-restore -o artifacts/publish/catalog-blazor

      # Proves every suite still runs; shared runners are too noisy for timings, so nothing is compared.
      - name: Benchmarks (dry run)
        run: dotnet run -c Release --no-build --project benchmarks/LinqToRest.Benchmarks -- --filter '*' --job dry

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspections
          path: artifacts/inspect.sarif
          if-no-files-found: ignore

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            clients/typescript/package-lock.json
            samples/Catalog/catalog-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format, lint, type-check
        run: |
          npm run format
          npm run lint
          npm run typecheck

      - name: Unit, golden and type tests
        run: npm test

      - name: Build
        run: npm run build

      # The React catalog sample builds against the client just built (file: dependency).
      - name: Catalog web app (format, lint, type-check, build)
        working-directory: samples/Catalog/catalog-web
        run: |
          npm ci
          npm run check

      # Proves the benchmarks still run; timings aren't compared on shared runners.
      - name: Benchmarks
        run: mkdir -p ../../artifacts && npm run bench

      - name: Audit
        run: npm audit --audit-level=high

      # The samples' models must match their sets; the golden test models are checked by the .NET tests.
      - name: Exported models and generated clients are current
        working-directory: .
        run: |
          dotnet build samples/Shop.Api
          dotnet build samples/Catalog/Catalog.Api
          dotnet build src/LinqToRest.CodeGen
          dotnet run --project samples/Shop.Api --no-build -- --Database:Provider=Sqlite --export-linqtorest-model model.json
          dotnet run --project samples/Catalog/Catalog.Api --no-build -- --export-linqtorest-model model.json
          git diff --exit-code samples/Shop.Api/model.json samples/Catalog/Catalog.Api/model.json
          generate() { dotnet run --project src/LinqToRest.CodeGen --no-build -- "$@" --check; }
          generate ts --model tests/golden/model.json --name Shop --import ../src/index.js --out clients/typescript/test/shop.generated.ts
          generate ts --model samples/Shop.Api/model.json --name Shop --import ../src/index.js --out clients/typescript/test-e2e/shop.generated.ts
          generate ts --model samples/Shop.Api/model.json --name Shop --out samples/shop-ts/shop.generated.ts
          generate cs --model samples/Shop.Api/model.json --namespace Shop.Client --context ShopContext --out samples/Shop.Client/ShopContext.generated.cs
          generate ts --model samples/Catalog/Catalog.Api/model.json --name Catalog --out samples/Catalog/catalog-web/src/catalog.generated.ts
          generate cs --model samples/Catalog/Catalog.Api/model.json --namespace Catalog.Client --context CatalogContext --out samples/Catalog/Catalog.Client/CatalogContext.generated.cs

      - name: End-to-end tests against samples/Shop.Api
        run: npm run test:e2e
