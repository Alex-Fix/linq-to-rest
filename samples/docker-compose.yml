# Local PostgreSQL for samples/Shop.Api. Dev-only credentials: never reuse them outside your machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop-dev
    ports:
      - "5432:5432"
    volumes:
      - shop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 2s
      retries: 15

volumes:
  shop-data:
