# Local PostgreSQL for samples/Catalog.Api (--Database:Provider=Postgres). Dev-only credentials: never reuse them
# outside your machine.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog-dev
    ports:
      - "5432:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      retries: 15

volumes:
  catalog-data:
